<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Essence Perfumaria</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "lucide-react": "https://esm.sh/lucide-react@0.400.0?external=react,react-dom"
    }
  }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-stone-50">
  <div id="root"></div>
  <script type="text/babel" data-type="module" data-presets="react">
    import React, { useState } from "react";
    import { createRoot } from "react-dom/client";
    import * as Lucide from "lucide-react";

    function App() {
      const [view, setView] = useState("home");
      const settings = {
        store_name: "Essence Perfumaria",
        store_whatsapp: "5531996831731",
        hero_title: "A essência da sua personalidade",
        store_hero: "https://images.unsplash.com/photo-1594035910387-fea47794261f?w=1600"
      };

      return (
        <div className="min-h-screen flex flex-col font-sans">
          <header className="h-20 bg-white border-b flex items-center justify-between px-8 sticky top-0 z-50">
            <h1 className="text-2xl font-bold text-stone-900">{settings.store_name}</h1>
            <div className="flex gap-4">
              <button onClick={() => setView("home")} className="font-medium">Início</button>
              <button onClick={() => setView("admin")} className="bg-black text-white px-4 py-2 rounded-lg text-sm flex items-center gap-2">
                <Lucide.Lock size={14}/> Admin
              </button>
            </div>
          </header>

          <main className="flex-grow">
            {view === "home" ? (
              <div className="text-center">
                <div className="h-[50vh] relative flex items-center justify-center">
                  <img src={settings.store_hero} className="absolute inset-0 w-full h-full object-cover" />
                  <div className="relative z-10 bg-white/80 p-8 rounded-2xl shadow-xl">
                    <h2 className="text-4xl font-bold mb-4">{settings.hero_title}</h2>
                    <a href="https://wa.me/5531996831731" className="bg-green-500 text-white px-8 py-3 rounded-full font-bold">Falar no WhatsApp</a>
                  </div>
                </div>
                <div className="py-20">
                   <p className="text-stone-400">O catálogo aparecerá aqui após o primeiro deploy com sucesso.</p>
                </div>
              </div>
            ) : (
              <div className="py-20 text-center">
                <h2 className="text-2xl font-bold mb-4">Painel Administrativo</h2>
                <p className="mb-8">O site precisa estar online (Success) para acessar o painel completo.</p>
                <button onClick={() => setView("home")} className="underline">Voltar</button>
              </div>
            )}
          </main>
        </div>
      );
    }
    createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
