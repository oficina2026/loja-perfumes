<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Essence Perfumaria</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "lucide-react": "https://esm.sh/lucide-react@0.400.0?external=react,react-dom"
    }
  }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@100..900&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #fdfcfb; }
    .font-serif { font-family: 'Playfair Display', serif; }
    .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-type="module" data-presets="react">
    import React, { useState, useEffect } from "react";
    import { createRoot } from "react-dom/client";
    import * as Lucide from "lucide-react";

    const { ShoppingBag, MessageCircle, MapPin, Phone, Settings, LogOut, Plus, Trash2, Edit, Save, X, ChevronRight, Image: ImageIcon, Lock } = Lucide;

    function App() {
      // Configurações e Produtos Iniciais
      const settings = {
        store_name: "Essence Perfumaria",
        hero_title: "A essência da sua personalidade",
        hero_subtitle: "Descubra fragrâncias exclusivas que capturam momentos e eternizam memórias.",
        store_whatsapp: "5531996831731",
        store_address: "Belo Horizonte, MG",
        store_hero: "https://images.unsplash.com/photo-1594035910387-fea47794261f?w=1600"
      };

      const products = [
        { id: '1', name: 'Blue Velvet', description: 'Fragrância marcante e fresca para o dia a dia.', price: 'R$ 380,00', image_url: 'https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=600' },
        { id: '2', name: 'Rose d\'Or', description: 'Delicadeza das rosas combinada com o toque do âmbar.', price: 'R$ 420,00', image_url: 'https://images.unsplash.com/photo-1585120040315-2241b774ad0f?w=600' },
        { id: '3', name: 'Oud Imperial', description: 'Amadeirado intenso e luxuoso para noites especiais.', price: 'R$ 550,00', image_url: 'https://images.unsplash.com/photo-1594035910387-fea47794261f?w=600' }
      ];

      const handleWhatsApp = (p) => {
        const msg = p ? `Olá! Tenho interesse no perfume *${p.name}*. Pode me ajudar?` : `Olá!`;
        window.open(`https://wa.me/${settings.store_whatsapp}?text=${encodeURIComponent(msg)}`, "_blank");
      };

      return (
        <div className="min-h-screen flex flex-col">
          <header className="sticky top-0 z-50 glass border-b border-stone-100 h-20 flex items-center justify-between px-8">
            <h1 className="text-2xl font-serif font-bold text-stone-900">{settings.store_name}</h1>
            <nav className="flex gap-8 text-sm font-medium text-stone-600">
              <a href="#" className="hover:text-stone-900">Início</a>
              <a href="#catalogo" className="hover:text-stone-900">Catálogo</a>
              <a href="https://wa.me/5531996831731" className="text-green-600">Contato</a>
            </nav>
          </header>
          
          <main className="flex-grow">
            <section className="relative h-[70vh] flex items-center justify-center text-center overflow-hidden">
               <img src={settings.store_hero} className="absolute inset-0 w-full h-full object-cover" />
               <div className="absolute inset-0 bg-black/20"></div>
               <div className="relative z-10 bg-white/40 backdrop-blur-md p-10 md:p-16 rounded-3xl border border-white/30 shadow-2xl max-w-3xl mx-4">
                  <h2 className="text-5xl md:text-7xl font-serif text-stone-900 mb-6 leading-tight">{settings.hero_title}</h2>
                  <p className="text-lg text-stone-800 mb-10 max-w-lg mx-auto">{settings.hero_subtitle}</p>
                  <a href="#catalogo" className="bg-stone-900 text-white px-10 py-4 rounded-full font-bold hover:bg-stone-800 transition-all">Explorar Catálogo</a>
               </div>
            </section>

            <section id="catalogo" className="py-24 px-8 max-w-7xl mx-auto">
              <div className="text-center mb-16">
                <h3 className="text-4xl font-serif text-stone-900 mb-4">Nossa Coleção Premium</h3>
                <p className="text-stone-500">Fragrâncias selecionadas para momentos inesquecíveis</p>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-12">
                {products.map(p => (
                  <div key={p.id} className="group bg-white rounded-2xl overflow-hidden shadow-sm border border-stone-100 hover:shadow-xl transition-all">
                    <div className="aspect-[4/5] overflow-hidden">
                      <img src={p.image_url} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                    </div>
                    <div className="p-6">
                      <h4 className="text-2xl font-serif text-stone-900 mb-2">{p.name}</h4>
                      <p className="text-stone-500 text-sm mb-4 h-10 line-clamp-2">{p.description}</p>
                      <div className="flex items-center justify-between mb-6">
                        <p className="text-xl font-bold text-stone-900">{p.price}</p>
                      </div>
                      <button onClick={() => handleWhatsApp(p)} className="w-full bg-stone-900 text-white py-4 rounded-xl flex items-center justify-center gap-3 font-bold hover:bg-stone-800 transition-colors">
                        <MessageCircle size={20} className="text-green-400"/> Consultar via WhatsApp
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </section>
          </main>

          <footer className="bg-stone-900 text-white py-16 px-8 text-center">
            <h4 className="text-2xl font-serif mb-4">{settings.store_name}</h4>
            <p className="text-stone-400 mb-8 max-w-md mx-auto">{settings.store_address}</p>
            <div className="flex justify-center gap-6 text-sm text-stone-500">
              <span>© 2026 Todos os direitos reservados</span>
            </div>
          </footer>
        </div>
      );
    }

    createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
